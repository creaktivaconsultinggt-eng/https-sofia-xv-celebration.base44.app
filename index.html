   <script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS77qUmgLTrj9poAdgateuQQIgTv-8B3YnsN8FY_8ErH0OjAprPu8X-ksH5J6bOZ87_JzPadJnd1Bhb/pub?gid=2125764309&single=true&output=csv";

  async function consultarInvitadoCSV(nombreBuscado) {
    try {
      const response = await fetch(CSV_URL);
      const text = await response.text();
      const filas = text.split("\n").map(l => l.split(","));
      const encontrado = filas.find(f => 
        f[1] && f[1].trim().toLowerCase().includes(nombreBuscado.trim().toLowerCase())
      );

      if (encontrado) {
        const nombre = encontrado[1].trim();
        const pases = encontrado[2] ? encontrado[2].trim() : "1";
        alert(`¡Hola ${nombre}! Tienes ${pases} pase(s) asignado(s).`);
      } else {
        alert("No encontramos tu nombre en el listado. Por favor verifica la escritura.");
      }
    } catch (err) {
      console.error(err);
      alert("Ocurrió un error al consultar la lista.");
    }
  }

  document.addEventListener("click", (e) => {
    const target = e.target.closest("button");
    if (target && target.textContent.toUpperCase().includes("VER MIS PASES")) {
      e.preventDefault();
      e.stopPropagation();
      
      const input = document.querySelector("input");
      if (input && input.value) {
        consultarInvitadoCSV(input.value);
      } else {
        alert("Por favor escribe tu nombre y apellido primero.");
      }
    }
  }, true);
     document.addEventListener("click", (e) => {
    const btnMapa = e.target.closest("a, button");
    if (btnMapa && btnMapa.textContent.toUpperCase().includes("VER EN GOOGLE MAPS")) {
      e.preventDefault();
      e.stopPropagation();
      window.open("https://maps.google.com/?q=14.736917,-90.585434", "_blank");
    }
  }, true);

      if (el.textContent && el.textContent.includes("Nombre por confirmar")) {
        let contenedor = el.closest("div");
        if (contenedor) contenedor.style.display = "none";
